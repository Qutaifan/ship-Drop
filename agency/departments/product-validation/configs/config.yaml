model:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
  context_length: 32768

tools:
  enabled:
    - web
    - search
    - memory
    - session_search
    - file
    - terminal
  disabled:
    - code_execution
    - browser

memory:
  enabled: true
  user_profile: true
  provider: local

security:
  redact_secrets: true
  redact_pii: true

delegation:
  model: openrouter/llama-3-70b-instruct
  provider: openrouter
  max_iterations: 50
  reasoning_effort: high
